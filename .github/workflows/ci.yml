name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each script is its own check, so a PR shows exactly what failed. `test` runs every
        # test; `test:story` repeats the story's own, so a story nobody can finish fails by name.
        task: [format:check, lint, typecheck, test, test:story, build:vercel, build-storybook]
    steps:
      - uses: actions/checkout@v5
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      # The same major as the Vercel function (`runtime` in scripts/build-vercel.ts).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}
