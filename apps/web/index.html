<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Spuštěná z plochy se hra otevře bez lišt prohlížeče (Safari je na iPhonu jinak skrýt nedovolí). -->
    <!-- The favicon recolors itself in a dark browser, see favicon.svg. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JUMP Kross" />
    <!-- Obsah sahá i pod stavový řádek; odsazení drží .safe-area-padding. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <!-- Hra je jen pro přihlášené týmy: vyhledávače ani AI agenti ji nemají indexovat ani číst. -->
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
    />
    <title>Gamebook</title>
    <!-- Link preview in messaging apps; the image needs an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUMP Kross 2027" />
    <meta property="og:title" content="JUMP Kross 2027" />
    <meta property="og:image" content="https://jump-kross-gamebook.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JUMP Gamebook" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tmavý režim ještě před prvním vykreslením, aby stránka v noci neblikla bíle. -->
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
