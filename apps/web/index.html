<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Spuštěná z plochy se hra otevře bez lišt prohlížeče (Safari je na iPhonu jinak skrýt nedovolí). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JUMP Kross" />
    <!-- Obsah sahá i pod stavový řádek; odsazení drží .safe-area-padding. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <!-- Hra je jen pro přihlášené týmy: vyhledávače ani AI agenti ji nemají indexovat ani číst. -->
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
    />
    <title>Gamebook</title>
    <!-- Tmavý režim ještě před prvním vykreslením, aby stránka v noci neblikla bíle. -->
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
